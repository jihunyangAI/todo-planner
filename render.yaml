# Render Blueprint: API가 웹(web/dist)까지 함께 서빙하는 서비스 하나를 만든다.
# 같은 출처라야 로그인 세션 쿠키가 브라우저에서 1st-party로 동작한다(*.onrender.com은 서로 다른 사이트로 취급됨).
# Render 대시보드 → New → Blueprint → 이 저장소 선택. 직접 입력할 값: MONGODB_URI, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
services:
  - type: web
    name: todo-planner
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w shared && npm run build -w api && npm run build -w web
    startCommand: npm run start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 테스트용 MongoDB 실행 파일(약 590MB) 다운로드를 건너뛴다
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: SERVE_WEB
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      # GitHub OAuth App의 값. Authorization callback URL은 https://<서비스 주소>/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Render가 무작위 값을 만들어 넣는다
      - key: SESSION_SECRET
        generateValue: true
      # PUBLIC_URL을 비워 두면 Render가 주는 RENDER_EXTERNAL_URL을 쓴다
