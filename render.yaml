# Render Blueprint: API(Node)와 웹(정적 사이트)을 한 번에 만든다.
# Render 대시보드 → New → Blueprint → 이 저장소 선택. 직접 입력할 값은 MONGODB_URI 하나다.
services:
  - type: web
    name: todo-planner-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w shared && npm run build -w api
    startCommand: npm run start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 테스트용 MongoDB 실행 파일(약 590MB) 다운로드를 건너뛴다
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # 웹 서비스의 도메인. 스킴이 없으면 API가 https://를 붙인다
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: todo-planner-web
          property: host

  - type: web
    name: todo-planner-web
    runtime: static
    buildCommand: npm ci && npm run build -w shared && npm run build -w web
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      # API 서비스의 도메인. 빌드 시점에 주입되고, 스킴이 없으면 웹이 https://를 붙인다
      - key: VITE_API_URL
        fromService:
          type: web
          name: todo-planner-api
          property: host
