name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새로 푸시하면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mongodb-memory-server가 내려받는 MongoDB 실행 파일 위치(캐시 대상)
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: MongoDB 실행 파일 캐시
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-7.0.14

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 단위·컴포넌트·API 테스트
        run: npm test

      - name: 다른 시간대(America/Los_Angeles)에서 테스트
        run: npm run test:tz

      - name: 빌드
        run: npm run build

      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 의존성 설치
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E 테스트
        run: npm run test:e2e

      - name: 실패 시 E2E 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
